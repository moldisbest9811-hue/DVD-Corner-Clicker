<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>DVD Hitting Corner Simulator</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
#screen{position:fixed;inset:0;background:#000;overflow:hidden;transform:translateZ(0)}
#screen.shake{animation:screenShake 260ms ease-out}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#dvd{position:absolute;z-index:1;width:clamp(150px,22vw,260px);height:auto;aspect-ratio:1058.4/465.84;background:#20d9e8;left:0;top:0;
-webkit-mask:url("./assets/logos/dvd.svg") center/contain no-repeat;mask:url("./assets/logos/dvd.svg") center/contain no-repeat;will-change:transform,background-color}
#tracker{position:fixed;top:18px;left:18px;z-index:5;display:flex;gap:18px;padding:12px 16px;border:1px solid #ffffff25;border-radius:0;background:#111c;color:#fff;font:600 13px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;backdrop-filter:blur(8px);pointer-events:none}
.stat{display:flex;flex-direction:column;gap:4px}
.stat span{color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.stat strong{font-size:22px;font-variant-numeric:tabular-nums}
@media(max-width:480px){#tracker{top:10px;left:10px;gap:12px;padding:9px 12px}.stat strong{font-size:18px}}
#effects{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none}
#flash.bounce{animation:wallFlash 150ms ease-out}
@keyframes wallFlash{0%{opacity:.22}100%{opacity:0}}
#rainbowToggle{position:fixed;right:18px;top:18px;z-index:6;border:1px solid #ffffff35;border-radius:0;background:#111c;color:#fff;padding:10px 14px;font:600 12px system-ui;cursor:pointer}
#rainbowToggle:focus-visible{outline:2px solid white;outline-offset:3px}
#celebration{position:fixed;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;opacity:0;color:#fff;text-align:center;font:900 clamp(38px,8vw,100px)/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.06em;text-shadow:0 0 18px #fff,0 0 42px #20d9e8}
#celebration.show{animation:perfectHit 950ms ease-out}
@keyframes perfectHit{0%{opacity:0;transform:scale(.72);background:rgba(255,255,255,0)}12%{opacity:1;transform:scale(1);background:rgba(255,255,255,.2)}100%{opacity:0;transform:scale(1.18);background:rgba(255,255,255,0)}}
</style>
</head>
<body>
<main id="screen" aria-label="DVD logo bouncing screensaver">
  <div id="dvd" role="img" aria-label="DVD Video logo"></div>
  <canvas id="effects"></canvas>
  <div id="flash"></div>
  <button id="rainbowToggle" type="button" aria-pressed="true">RAINBOW: ON</button>
  <div id="celebration" aria-live="polite"><span>PERFECT HIT!</span></div>
  <aside id="tracker" aria-label="Animation statistics">
    <div class="stat"><span>Corner Hits</span><strong id="cornerCount">0</strong></div>
    <div class="stat"><span>Wall Bounces</span><strong id="bounceCount">0</strong></div>
  </aside>
</main>
<script>
(() => {
  "use strict";
  const screen = document.getElementById("screen");
  const dvd = document.getElementById("dvd");
  const cornerCount = document.getElementById("cornerCount");
  const bounceCount = document.getElementById("bounceCount");
  const celebration = document.getElementById("celebration");
  const canvas = document.getElementById("effects");
  const ctx = canvas.getContext("2d");
  const flash = document.getElementById("flash");
  const rainbowToggle = document.getElementById("rainbowToggle");
  let rainbowMode = true;
  let hue = 0;
  let slowUntil = 0;
  let particles = [];
  let trailPoints = [];
  const colors = ["#20d9e8","#ff3b30","#ffd60a","#34c759","#0a84ff","#bf5af2","#ff2d55","#ff9f0a"];
  let x = 80, y = 70, vx = 2.35, vy = 1.75;
  let last = 0;
  let lastXHit = -Infinity, lastYHit = -Infinity;
  const cornerWindow = 650;
  let cornerHits = 0;
  let wallBounces = 0;

  function bounds() {
    const r = dvd.getBoundingClientRect();
    return { w: r.width, h: r.height, maxX: Math.max(0, innerWidth-r.width), maxY: Math.max(0, innerHeight-r.height) };
  }
  function changeColor() {
    const current = dvd.style.backgroundColor;
    let next = colors[Math.floor(Math.random()*colors.length)];
    while (next === current) next = colors[Math.floor(Math.random()*colors.length)];
    dvd.style.backgroundColor = next;
  }
  function resizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth*dpr);
    canvas.height = Math.round(innerHeight*dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function burst(xp, yp) {
    for (let i=0;i<42;i++) {
      const a=Math.random()*Math.PI*2, speed=2+Math.random()*6;
      particles.push({x:xp,y:yp,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1,size:2+Math.random()*4,hue:Math.random()*360});
    }
  }
  function drawEffects() {
    ctx.fillStyle="rgba(0,0,0,0.22)";
    ctx.fillRect(0,0,innerWidth,innerHeight);
    if (trailPoints.length>1) {
      for(let i=1;i<trailPoints.length;i++) {
        const p=trailPoints[i], prev=trailPoints[i-1];
        ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(p.x,p.y);
        ctx.strokeStyle=`hsla(${p.hue},100%,65%,${p.life*.28})`;ctx.lineWidth=3*p.life;ctx.stroke();
      }
    }
    trailPoints.forEach(p=>p.life-=.035);
    trailPoints=trailPoints.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.018;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,65%,${p.life})`;ctx.fill();});
    particles=particles.filter(p=>p.life>0);
  }
  function triggerFlash() {
    flash.classList.remove("bounce");void flash.offsetWidth;flash.classList.add("bounce");
  }
  rainbowToggle.addEventListener("click",()=>{
    rainbowMode=!rainbowMode;
    rainbowToggle.textContent="RAINBOW: "+(rainbowMode?"ON":"OFF");
    rainbowToggle.setAttribute("aria-pressed",String(rainbowMode));
    if(!rainbowMode) dvd.style.filter="none";
  });
  function celebrateCornerHit() {
    celebration.classList.remove("show");
    void celebration.offsetWidth;
    celebration.classList.add("show");
    const b=bounds();
    burst(x+b.w/2,y+b.h/2);
    screen.classList.remove("shake");void screen.offsetWidth;screen.classList.add("shake");
    slowUntil=performance.now()+650;
  }
  function frame(now) {
    if (!last) last = now;
    const baseDt = Math.min((now-last)/16.6667, 2.5);
    const dt = baseDt * (now<slowUntil ? 0.35 : 1);
    last = now;
    const b = bounds();
    x += vx*dt;
    y += vy*dt;
    let hitX = false, hitY = false;
    if (x <= 0) { x=0; vx=Math.abs(vx); hitX=true; }
    else if (x >= b.maxX) { x=b.maxX; vx=-Math.abs(vx); hitX=true; }
    if (y <= 0) { y=0; vy=Math.abs(vy); hitY=true; }
    else if (y >= b.maxY) { y=b.maxY; vy=-Math.abs(vy); hitY=true; }
    if (hitX || hitY) { triggerFlash(); if(!rainbowMode) changeColor(); }
    if (hitX) { lastXHit=now; wallBounces++; }
    if (hitY) { lastYHit=now; wallBounces++; }
    if ((hitX && now-lastYHit<=cornerWindow) || (hitY && now-lastXHit<=cornerWindow)) {
      cornerHits++;
      celebrateCornerHit();
      cornerCount.textContent = cornerHits.toLocaleString();
      document.title = "DVD Hitting Corner Simulator · " + cornerHits + " corner hits";
      lastXHit=lastYHit=-Infinity;
    }
    if (hitX || hitY) bounceCount.textContent = wallBounces.toLocaleString();
    if (rainbowMode) { hue=(hue+1.8*baseDt)%360; dvd.style.filter=`hue-rotate(${hue}deg)`; }
    dvd.style.transform = `translate3d(${x}px,${y}px,0)`;
    const b2=bounds();
    trailPoints.push({x:x+b2.w/2,y:y+b2.h/2,life:1,hue});
    if(trailPoints.length>18) trailPoints.shift();
    drawEffects();
    requestAnimationFrame(frame);
  }
  addEventListener("resize", () => {
    resizeCanvas();
    const b=bounds();
    x=Math.min(x,b.maxX); y=Math.min(y,b.maxY);
  });
  resizeCanvas();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
